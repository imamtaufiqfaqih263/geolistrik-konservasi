<html lang="id">
<head>

<title>SIGEO-ZKAT — Data Geolistrik Zona Konservasi Air Tanah</title>
<!--
  ============================================================================
  SIGEO-ZKAT — versi mandiri (standalone), tanpa proses build.
  ----------------------------------------------------------------------------
  CARA HOSTING DI GITHUB PAGES (gratis, ± 10 menit):
  1. Buat akun GitHub (github.com) kalau belum punya.
  2. Klik "+" di kanan atas > "New repository". Nama bebas, mis. "sigeo-zkat".
     Centang "Public". Klik "Create repository".
  3. Di halaman repo, klik "Add file" > "Upload files". Unggah file ini,
     TAPI ganti namanya jadi persis:  index.html
  4. Klik "Commit changes".
  5. Buka menu "Settings" (di repo yang sama) > "Pages" (di sidebar kiri).
  6. Di "Branch", pilih "main" / "master", folder "/ (root)" > Save.
  7. Tunggu 1-2 menit, lalu situs Anda aktif di:
     https://<username-github-anda>.github.io/sigeo-zkat/
  8. Bagikan link itu ke tim — bisa dibuka di HP mana saja, tanpa akun,
     tanpa login, dan TIDAK lewat claude.ai sama sekali.

  Ganti APPS_SCRIPT_URL di bawah kalau Anda deploy ulang Apps Script dan
  URL-nya berubah.
  ============================================================================
-->

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F2937">
<style>
  :root{
    --paper:#FAFAFA; --ink:#1F2937; --ink-soft:#6B7280; --line:#E5E7EB;
    --panel:#FFFFFF; --slate:#1F2937; --accent:#2563EB; --accent-deep:#1D4ED8;
    --good:#16A34A; --warn:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',Inter,system-ui,sans-serif;}
  input,select,button,textarea{font-family:inherit;}
  input,select{background:#fff;color:#111827;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  table{border-collapse:collapse;width:100%;}
  .mono{font-family:'Courier New',monospace;}
  .no-print{}
  .hidden{display:none !important;}
  header.app-header{background:var(--slate);color:#F9FAFB;padding:18px 20px;}
  .header-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{width:34px;height:34px;border-radius:6px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;}
  .brand-title{color:#F9FAFB;font-weight:700;font-size:15px;letter-spacing:.3px;}
  .brand-sub{color:#9CA3AF;font-size:11px;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  select.kabSelect{background:#2A3444;color:#F9FAFB;border:1px solid #4B5563;border-radius:6px;padding:6px 10px;font-size:13px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;
    padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost-dark{background:transparent;color:#F9FAFB;border:1px solid #4B5563;}
  .btn-good{background:var(--good);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
  nav.tabs{display:flex;gap:4px;margin-top:16px;}
  nav.tabs button{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;
    font-weight:600;border-radius:8px 8px 0 0;cursor:pointer;background:transparent;color:#C7CCC3;border:none;}
  nav.tabs button.active{background:var(--paper);color:var(--ink);}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);
    margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  .field input,.field select{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:13px;}
  .grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px;}
  .station-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .station-badge{width:44px;height:44px;border-radius:8px;background:var(--slate);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .banner{text-align:center;font-size:12.5px;font-weight:600;padding:8px 12px;color:#fff;background:var(--warn);}
  th{text-align:left;padding:8px 10px;font-size:11px;color:var(--ink-soft);font-weight:700;white-space:nowrap;background:var(--paper);}
  td{padding:6px 10px;font-size:12.5px;white-space:nowrap;}
  td input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:'Courier New',monospace;}
  .status-msg{font-size:12px;font-weight:600;max-width:280px;text-align:right;}
  .status-ok{color:var(--good);} .status-err{color:var(--warn);} .status-saving{color:var(--ink-soft);}
  .empty{text-align:center;padding:50px;}
  .center{text-align:center;padding:60px;color:var(--ink-soft);}
  a.link-btn{text-decoration:none;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
  }
  .print-h2{font-size:15px;margin-top:24px;margin-bottom:8px;border-bottom:1px solid #1F2937;padding-bottom:4px;}
  .print-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
  .print-table th{text-align:left;padding:5px 8px;border:1px solid #ccc;background:#f2f2f2;}
  .print-table td{padding:5px 8px;border:1px solid #ccc;font-size:11px;}
</style>
</head>

function rho(i,v,k){
  var I=parseFloat(i), V=parseFloat(v);
  if(!I || !isFinite(I) || !V || !isFinite(V)) return null;
  return (V/I)*k;
}
function classify(r){
  if(r==null) return {label:"-",color:"#9CA3AF"};

}

      v: f.symbol,
      label: f.name + " — " + f.formation + " (" + f.symbol + ")",
      umur: f.age,
      litho: f.litho,
      rho: r.rho || null
    };
  })
);
function getFormasi(v){ return FORMASI_BUTON.find(function(f){return f.v===v;}) || FORMASI_BUTON[0]; }
function crossCheckFormasi(rhoAvg, formasiValue){
  if(!formasiValue) return null;
  var f = getFormasi(formasiValue);
  if(!f || !f.rho) return null;
  var inRange = rhoAvg >= f.rho[0] && rhoAvg <= f.rho[1];
  return {
    match: inRange,
    text: inRange
      ? ("Konsisten dengan "+f.label+" ("+f.litho+")")
      : ("Di luar rentang umum "+f.label+" ("+f.rho[0]+"–"+f.rho[1]+" \u03A9\u00B7m) — indikasi pelapukan, rekahan/zona jenuh air, atau formasi berbeda; perlu verifikasi lapangan")
  };
}

/* ---- Point-in-polygon (mendukung multi-ring: pulau & lubang) ---- */
function pointInRing(x, y, ring){
  var inside = false;
  for(var i=0, j=ring.length-1; i<ring.length; j=i++){
    var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    var intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function pointInRings(x, y, rings){
  var count = 0;
  for(var r=0; r<rings.length; r++){ if(pointInRing(x,y,rings[r])) count++; }
  return (count % 2) === 1;
}
function detectFormasiFromCoord(lng, lat){
  if(lng==null || lat==null || isNaN(lng) || isNaN(lat)) return "";
  for(var i=0; i<BUTON_GEOLOGY.length; i++){
    if(pointInRings(lng, lat, BUTON_GEOLOGY[i].rings)) return BUTON_GEOLOGY[i].symbol;
  }
  return "";
}
function tryAutoDetectFormasi(){
  if(!S.draft || !S.draft.x || !S.draft.y) return;
  var lng = parseFloat(S.draft.x), lat = parseFloat(S.draft.y);
  var detected = detectFormasiFromCoord(lng, lat);
  S.draft.formasiAuto = detected;
  if(detected){ S.draft.formasi = detected; }
  var sel = document.getElementById("fFormasi");
  var badge = document.getElementById("formasiAutoBadge");
  if(sel) sel.value = S.draft.formasi || "";
  if(badge){
    badge.innerHTML = detected
      ? '<span style="font-size:11px;color:var(--good);font-weight:600;">✓ terdeteksi otomatis dari koordinat</span>'
      : '<span style="font-size:11px;color:var(--ink-soft);">koordinat di luar cakupan Lembar Buton — pilih manual</span>';
  }
}

/* Terapkan deteksi formasi ke SEMUA stasiun yang sudah ada & berkoordinat
   (mis. GL.01-GL.06 yang diinput sebelum fitur ini ada), lalu sinkronkan. */
function autoDetectAllStations(){
  if(!S.kabData || S.kabData.stations.length===0) return;
  var total = 0, updated = 0, promises = [];
  S.kabData.stations.forEach(function(s){
    if(!s.x || !s.y) return;
    total++;
    var lng = parseFloat(s.x), lat = parseFloat(s.y);
    var detected = detectFormasiFromCoord(lng, lat);
    if(detected && detected !== s.formasi){
      s.formasi = detected;
      s.formasiAuto = detected;
      updated++;
      var body = {action:"saveStation", slug:S.activeSlug, station:s};
      if(navigator.onLine){
        promises.push(apiPost(body).then(function(r){
          if(!(r && r.ok)){ s._pending=true; queueAction({slug:S.activeSlug, body:body}); }
          else { s._pending=false; }
        }));
      } else {
        s._pending = true;
        queueAction({slug:S.activeSlug, body:body});
      }
    }
  });
  if(total===0){
    S.saveStatus={state:"err", msg:"Belum ada stasiun berkoordinat untuk dideteksi."};
    renderApp();
    setTimeout(function(){ S.saveStatus=null; renderApp(); }, 3000);
    return;
  }
  S.saveStatus={state:"saving", msg:"Mendeteksi & menyinkronkan formasi..."};
  renderApp();
  Promise.all(promises).then(function(){
    S.saveStatus={state:"ok", msg: updated+" dari "+total+" stasiun berkoordinat diperbarui formasinya"};
    renderApp();
    setTimeout(function(){ S.saveStatus=null; renderApp(); }, 4000);
  });
}

function interpretLayers(datum, formasiValue){
  var pts=[];
  datum.forEach(function(d){ var r=rho(d.i,d.v,d.k); if(r!=null) pts.push({ab2:d.ab2,rho:r}); });
  if(pts.length<2) return [];
  var layers=[], seg=[pts[0]];
  for(var idx=1; idx<pts.length; idx++){
    var avg = seg.reduce(function(a,b){return a+b.rho;},0)/seg.length;
    var cur = pts[idx];
    var change = Math.abs(cur.rho-avg)/avg;
    if(change>0.45 && seg.length>=2){ layers.push(seg); seg=[cur]; } else { seg.push(cur); }
  }
  layers.push(seg);
  return layers.map(function(s,idx){
    var avg=s.reduce(function(a,b){return a+b.rho;},0)/s.length;
    var c=classify(avg);
    var cross = crossCheckFormasi(avg, formasiValue);
    return {lapisan:idx+1, ab2Min:s[0].ab2, ab2Max:s[s.length-1].ab2, rhoAvg:avg, label:c.label, color:c.color, cross:cross};
  });
}

function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============================================================
   BACKEND (Google Apps Script) — semua lewat GET
   ============================================================ */
function apiCall(action, params){
  params = params || {};
  var url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set("action", action);
  Object.keys(params).forEach(function(k){ url.searchParams.set(k, params[k]); });
  return fetch(url.toString()).then(function(res){
    if(!res.ok) return {__error:"HTTP "+res.status+" "+res.statusText};
    return res.json();
  }).catch(function(e){
    return {__error:(e && e.message) ? e.message : String(e)};
  });
}
function apiGet(action, params){ return apiCall(action, params); }
function apiPost(body){
  var action = body.action;
  var params = {};
  Object.keys(body).forEach(function(k){ if(k!=="action") params[k]=body[k]; });
  if(params.station) params.station = JSON.stringify(params.station);
  return apiCall(action, params);
}

   STATE

var S = {
  ready:false, loadError:null,
  index:[], activeSlug:null, kabData:null,
  tab:"input", draft:null, showAddKab:false,
  gpsStatus:null, saveStatus:null, selectedStationId:null,
  isOnline: navigator.onLine
};

window.addEventListener("online", function(){ S.isOnline=true; renderApp(); });
window.addEventListener("offline", function(){ S.isOnline=false; renderApp(); });

/* ============================================================
   INIT
   ============================================================ */
function init(){
  apiGet("index").then(function(idx){
    if(!Array.isArray(idx)){
      S.loadError = (idx && idx.__error) ? idx.__error : "Tidak bisa terhubung ke Google Sheets.";
      idx = [];
    }
    if(idx.length===0){
      var seed = {slug:"buton-utara", nama:"Buton Utara"};
      return apiPost({action:"addKabupaten", slug:seed.slug, nama:seed.nama}).then(function(r){
        if(r && r.ok){ idx=[seed]; }
        else if(!S.loadError){ S.loadError = (r && (r.__error||r.error)) ? (r.__error||r.error) : "Gagal membuat kabupaten awal."; }
        finishInit(idx);
      });
    }
    finishInit(idx);
  });
}
function finishInit(idx){
  S.index = idx;
  S.ready = true;
  if(idx[0]) loadKabupaten(idx[0].slug); else renderApp();
}
function loadKabupaten(slug){
  S.activeSlug = slug;
  S.kabData = null;
  S.draft = null;
  S.selectedStationId = null;
  renderApp();
  apiGet("stations", {slug:slug}).then(function(stations){
    if(!Array.isArray(stations)) stations = [];
    var found = S.index.find(function(k){ return k.slug===slug; });
    S.kabData = {nama: found?found.nama:slug, stations:stations};
    renderApp();
  });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function handleAddKabupaten(){
  var val = document.getElementById("newKabInput").value.trim();
  if(!val) return;
  var slug = slugify(val) || ("kab-"+Date.now());
  var existing = S.index.find(function(k){ return k.slug===slug; });
  if(existing){ S.showAddKab=false; loadKabupaten(slug); return; }

  if(!navigator.onLine){
    S.index.push({slug:slug, nama:val});
    queueAction({slug:slug, body:{action:"addKabupaten", slug:slug, nama:val}});
    S.showAddKab=false;
    S.activeSlug=slug;
    S.kabData={nama:val, stations:[]};
    S.draft=null;
    renderApp();
    return;
  }
  apiPost({action:"addKabupaten", slug:slug, nama:val}).then(function(r){
    if(r && r.ok){
      S.index.push({slug:slug, nama:val});
      S.showAddKab=false;
      loadKabupaten(slug);
    } else {
      // Gagal kirim (jaringan/CORS) — tetap buat lokal & antrekan, jangan blokir kerja
      S.index.push({slug:slug, nama:val});
      queueAction({slug:slug, body:{action:"addKabupaten", slug:slug, nama:val}});
      S.showAddKab=false;
      S.activeSlug=slug;
      S.kabData={nama:val, stations:[]};
      S.draft=null;
      renderApp();
    }
  });
}
function startNewStation(){
  if(!S.kabData) return;
  var nextNo = S.kabData.stations.length+1;
  S.draft = {
    id:"st-"+Date.now(), no:padStasiun(nextNo), lokasi:"", x:"", y:"", formasi:"",
    tanggal:new Date().toISOString().slice(0,10), arahLintasan:"", pengamat:"", datum:emptyDatum()
  };
  S.gpsStatus=null; S.tab="input"; renderApp();
}
function editStation(id){
  var st = S.kabData.stations.find(function(s){ return s.id===id; });
  if(!st) return;
  S.draft = JSON.parse(JSON.stringify(st));
  S.gpsStatus=null; S.tab="input"; renderApp();
}
function backToList(){ S.draft=null; renderApp(); }

function captureGPS(){
  if(!navigator.geolocation){
    S.gpsStatus={state:"err",msg:"Browser ini tidak mendukung GPS. Tempel koordinat dari Google Maps."};
    updateGpsUI(); return;
  }
  S.gpsStatus={state:"loading",msg:"Mengambil lokasi..."};
  updateGpsUI();
  navigator.geolocation.getCurrentPosition(function(pos){
    var lo=pos.coords.longitude, la=pos.coords.latitude, acc=pos.coords.accuracy;
    S.draft.x = lo.toFixed(6); S.draft.y = la.toFixed(6);
    document.getElementById("draftX").value = S.draft.x;
    document.getElementById("draftY").value = S.draft.y;
    tryAutoDetectFormasi();
    S.gpsStatus={state:"ok",msg:"Lokasi terkunci (± "+Math.round(acc)+" m)"};
    updateGpsUI();
  }, function(err){
    var msg="Gagal mengambil lokasi otomatis.";
    if(err && err.code===1) msg='Izin lokasi ditolak/diblokir. Gunakan tombol "Tempel dari Clipboard".';
    else if(err && err.code===2) msg="Sinyal GPS tidak tersedia. Coba di area terbuka, atau tempel dari Clipboard.";
    else if(err && err.code===3) msg="GPS terlalu lama merespons. Coba lagi, atau tempel dari Clipboard.";
    S.gpsStatus={state:"err",msg:msg};
    updateGpsUI();
  }, {enableHighAccuracy:true, timeout:12000});
}
function pasteFromClipboard(){
  navigator.clipboard.readText().then(function(text){
    var m = text.match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
    if(!m){
      S.gpsStatus={state:"err",msg:"Clipboard tidak berisi koordinat. Salin dulu dari Google Maps."};
      updateGpsUI(); return;
    }
    var lat=parseFloat(m[1]), lng=parseFloat(m[2]);
    S.draft.x=lng.toFixed(6); S.draft.y=lat.toFixed(6);
    document.getElementById("draftX").value=S.draft.x;
    document.getElementById("draftY").value=S.draft.y;
    tryAutoDetectFormasi();
    S.gpsStatus={state:"ok",msg:"Koordinat ditempel dari Clipboard."};
    updateGpsUI();
  }).catch(function(){
    S.gpsStatus={state:"err",msg:"Tidak bisa membaca Clipboard (izin ditolak). Tempel manual."};
    updateGpsUI();
  });
}
function updateGpsUI(){
  var el = document.getElementById("gpsStatusArea");
  if(!el) return;
  if(!S.gpsStatus){ el.innerHTML=""; return; }
  var color = S.gpsStatus.state==="err" ? "var(--warn)" : S.gpsStatus.state==="ok" ? "var(--good)" : "var(--ink-soft)";
  el.innerHTML = '<span style="font-size:12px;color:'+color+'">'+esc(S.gpsStatus.msg)+'</span>';
}

function saveStation(){
  if(!S.draft || !S.kabData) return;
  var stationToSave = S.draft;
  var body = {action:"saveStation", slug:S.activeSlug, station:stationToSave};

  // Simpan dulu secara lokal (optimistik) supaya kerja lapangan tidak terhenti
  var exists = S.kabData.stations.find(function(s){ return s.id===stationToSave.id; });
  if(exists){
    S.kabData.stations = S.kabData.stations.map(function(s){ return s.id===stationToSave.id ? stationToSave : s; });
  } else {
    S.kabData.stations.push(stationToSave);
  }

  if(!navigator.onLine){
    stationToSave._pending = true;
    queueAction({slug:S.activeSlug, body:body});
    S.saveStatus={state:"ok",msg:"Tersimpan di HP (offline) — akan disinkron otomatis saat online"};
    S.draft=null;
    renderApp();
    setTimeout(function(){ S.saveStatus=null; renderApp(); }, 3000);
    return;
  }

  S.saveStatus={state:"saving",msg:"Menyimpan..."};
  renderApp();
  apiPost(body).then(function(r){
    if(r && r.ok){
      stationToSave._pending = false;
      S.saveStatus={state:"ok",msg:"Tersimpan"};
      S.draft=null;
      renderApp();
      setTimeout(function(){ S.saveStatus=null; renderApp(); }, 2000);
    } else {
      // Gagal (jaringan/CORS/dll) — tetap simpan lokal & masukkan antrean, jangan hilang
      stationToSave._pending = true;
      queueAction({slug:S.activeSlug, body:body});
      var detail = (r && (r.__error||r.error)) ? (r.__error||r.error) : "tidak ada respons dari server";
      S.saveStatus={state:"err",msg:"Belum berhasil kirim ke server ("+detail+") — data tersimpan di HP, akan dicoba lagi otomatis."};
      S.draft=null;
      renderApp();
    }
  });
}
function deleteStation(id){
  if(!S.kabData) return;
  S.kabData.stations = S.kabData.stations.filter(function(s){ return s.id!==id; });
  renderApp();
  if(!navigator.onLine){
    queueAction({slug:S.activeSlug, body:{action:"deleteStation", slug:S.activeSlug, stationId:id}});
    return;
  }
  apiPost({action:"deleteStation", slug:S.activeSlug, stationId:id}).then(function(r){
    if(!(r && r.ok)){
      queueAction({slug:S.activeSlug, body:{action:"deleteStation", slug:S.activeSlug, stationId:id}});
    }
  });
}

function updateDraftField(field, val){ if(S.draft) S.draft[field]=val; }
function updateDatumField(no, field, val){
  var row = S.draft.datum.find(function(d){ return d.no===no; });

  row[field]=val;

  var rCell = document.getElementById("r-"+no);

}

/* ============================================================
   SVG CHART HELPERS (tanpa library)
   ============================================================ */
function svgRouteMap(points, w, h){
  w=w||600; h=h||300;
  if(points.length<1) return '<p style="color:var(--ink-soft);font-size:13px;">Belum ada stasiun dengan koordinat.</p>';
  var xs=points.map(function(p){return p.x;}), ys=points.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var padX=(maxX-minX)*0.15 || 0.01, padY=(maxY-minY)*0.15 || 0.01;
  minX-=padX; maxX+=padX; minY-=padY; maxY+=padY;
  var m=30;
  function sx(x){ return m + (x-minX)/(maxX-minX||1) * (w-2*m); }
  function sy(y){ return h-m - (y-minY)/(maxY-minY||1) * (h-2*m); }
  var pathD = points.map(function(p,i){ return (i===0?"M":"L")+sx(p.x).toFixed(1)+","+sy(p.y).toFixed(1); }).join(" ");
  var dots = points.map(function(p){
    return '<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="4" fill="#2563EB" stroke="#fff" stroke-width="1.5"/>'+
      '<text x="'+(sx(p.x)+6).toFixed(1)+'" y="'+(sy(p.y)-6).toFixed(1)+'" font-size="10" fill="#374151">'+esc(p.no)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;">'+
    '<path d="'+pathD+'" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3"/>'+dots+'</svg>';
}
function svgVesCurve(points, w, h){
  w=w||600; h=h||260;
  if(points.length<2) return '<p style="color:var(--ink-soft);font-size:13px;">Data belum cukup untuk kurva sounding.</p>';
  var xs=points.map(function(p){return Math.log10(p.ab2);});
  var ys=points.map(function(p){return Math.log10(p.rhoa);});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var m=36;
  function sx(x){ return m + (Math.log10(x)-minX)/((maxX-minX)||1) * (w-2*m); }
  function sy(y){ return h-m - (Math.log10(y)-minY)/((maxY-minY)||1) * (h-2*m); }
  var pathD = points.map(function(p,i){ return (i===0?"M":"L")+sx(p.ab2).toFixed(1)+","+sy(p.rhoa).toFixed(1); }).join(" ");
  var dots = points.map(function(p){
    return '<circle cx="'+sx(p.ab2).toFixed(1)+'" cy="'+sy(p.rhoa).toFixed(1)+'" r="3" fill="#2563EB"/>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;">'+
    '<path d="'+pathD+'" fill="none" stroke="#2563EB" stroke-width="2"/>'+dots+
    '<text x="'+(w/2)+'" y="'+(h-8)+'" font-size="10" text-anchor="middle" fill="#6B7280">AB/2 (m, skala log)</text>'+
    '<text x="10" y="14" font-size="10" fill="#6B7280">\u03C1a (\u03A9\u00B7m, skala log)</text>'+
    '</svg>';
}

   RENDER
   ============================================================ */
function renderApp(){
  var app = document.getElementById("app");
  if(!S.ready){
    app.innerHTML = '<div class="center">Memuat...</div>';
    return;
  }
  var html = "";
  if(!S.isOnline){
    html += '<div class="banner no-print">Tidak ada koneksi internet — perubahan belum tersinkron. Isi formulir tetap bisa dilanjutkan, tekan "Simpan" lagi setelah sinyal kembali.</div>';
  }
  if(S.loadError){
    html += '<div class="banner no-print">Gagal terhubung ke Google Sheets: '+esc(S.loadError)+'</div>';
  }
  html += renderHeader();
  html += '<div class="wrap">';
  if(S.tab==="input") html += renderInputTab();
  else if(S.tab==="rekap") html += renderRekapTab();
  else if(S.tab==="print") html += renderPrintTab();
  html += '</div>';
  app.innerHTML = html;
  attachHandlers();
  updateQueueBadge();
}

function renderHeader(){
  if(S.tab==="print") return "";
  var opts = S.index.map(function(k){
    return '<option value="'+esc(k.slug)+'" '+(k.slug===S.activeSlug?"selected":"")+'>'+esc(k.nama)+'</option>';
  }).join("");
  var statusHtml = "";
  if(S.saveStatus){
    var cls = S.saveStatus.state==="err"?"status-err":S.saveStatus.state==="saving"?"status-saving":"status-ok";
    statusHtml = '<span class="status-msg '+cls+'">'+esc(S.saveStatus.msg)+'</span>';
  }
  return ''+
  '<header class="app-header no-print">'+
    '<div class="header-top">'+
      '<div class="brand"><div class="brand-badge">Z</div>'+
        '<div><div class="brand-title">SIGEO-ZKAT</div><div class="brand-sub">Sistem Data Geolistrik Zona Konservasi Air Tanah</div></div>'+
      '</div>'+
      '<div class="header-right">'+
        '<select id="kabSelect" class="kabSelect">'+opts+'</select>'+
        (S.showAddKab ?
          '<input id="newKabInput" placeholder="Nama kabupaten/kota" style="border-radius:6px;padding:6px 10px;font-size:13px;border:none;width:160px;background:#fff;color:#111827;">'+
          '<button id="btnConfirmAddKab" class="btn btn-good btn-sm">OK</button>'
          :
          '<button id="btnShowAddKab" class="btn btn-ghost-dark btn-sm">+ Kab/Kota Baru</button>'
        )+
        statusHtml+
        '<span id="queueBadge" style="font-size:11px;color:#FCA5A5;font-weight:600;"></span>'+
      '</div>'+
    '</div>'+
    '<nav class="tabs">'+
      '<button data-tab="input" class="'+(S.tab==="input"?"active":"")+'">Input Data</button>'+
      '<button data-tab="rekap" class="'+(S.tab==="rekap"?"active":"")+'">Rekapan &amp; Laporan</button>'+
    '</nav>'+
  '</header>';
}

function renderInputTab(){
  if(!S.kabData) return '<div class="center">Memuat data kabupaten...</div>';
  if(!S.draft) return renderStationList();
  return renderStationForm();
}

function renderStationList(){
  var n = S.kabData.stations.length;
  var last = n>0 ? S.kabData.stations[n-1].no : null;
  var statusHtml = "";
  if(S.saveStatus){
    var cls = S.saveStatus.state==="err"?"status-err":S.saveStatus.state==="saving"?"status-saving":"status-ok";
    statusHtml = '<div class="'+cls+'" style="font-size:12px;font-weight:600;margin-bottom:10px;">'+esc(S.saveStatus.msg)+'</div>';
  }
  var html = statusHtml+'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">'+
    '<div><h1 style="font-size:20px;font-weight:700;margin:0;">'+esc(S.kabData.nama)+'</h1>'+
    '<p style="color:var(--ink-soft);font-size:13px;margin:4px 0 0;">'+n+' stasiun tercatat'+(last?(' — GL.01 s.d. '+esc(last)):'')+'</p></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
    (n>0 ? '<button id="btnAutoDetectAll" class="btn btn-ghost">Deteksi Ulang Formasi (Semua Stasiun)</button>' : '')+
    '<button id="btnNewStation" class="btn btn-primary">+ Tambah Stasiun '+esc(padStasiun(n+1))+'</button>'+
    '</div>'+
  '</div>';
  if(n===0){
    html += '<div class="panel empty"><div style="font-weight:600;margin-bottom:4px;">Belum ada stasiun tercatat</div>'+
      '<p style="color:var(--ink-soft);font-size:13px;margin-bottom:16px;">Mulai kunjungan lapangan dengan menambah stasiun pertama (GL.01).</p>'+
      '<button id="btnNewStation2" class="btn btn-primary">+ Tambah Stasiun GL.01</button></div>';
  } else {
    html += '<div style="display:grid;gap:10px;">';
    S.kabData.stations.forEach(function(s){
      var filled = s.datum.filter(function(d){return d.i&&d.v;}).length;
      html += '<div class="panel station-row" data-edit="'+esc(s.id)+'">'+
        '<div style="display:flex;align-items:center;gap:14px;">'+
          '<div class="station-badge">'+esc(s.no.replace("GL.",""))+'</div>'+
          '<div><div style="font-weight:600;font-size:14px;">'+esc(s.no)+' — '+esc(s.lokasi||"(lokasi belum diisi)")+
            (s._pending ? ' <span style="font-size:10px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 5px;">belum tersinkron</span>' : '')+
          '</div>'+
          '<div style="font-size:12px;color:var(--ink-soft);display:flex;gap:12px;margin-top:2px;flex-wrap:wrap;">'+
            '<span>'+(s.x&&s.y?esc(s.x+", "+s.y):"belum ada koordinat")+'</span>'+
            '<span>'+esc(s.tanggal)+'</span><span>'+filled+'/24 datum terisi</span>'+
            (s.formasi ? '<span>Formasi: '+esc(getFormasi(s.formasi).name)+'</span>' : '')+
          '</div></div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:6px;">'+
          '<button data-del="'+esc(s.id)+'" class="btn btn-sm" style="background:none;color:var(--warn);">Hapus</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div>';
  }
  return html;
}

  var filled = d.datum.filter(function(x){return x.i&&x.v;}).length;
  var rows = d.datum.map(function(row){
    var r = (row.i&&row.v) ? (parseFloat(row.v)/parseFloat(row.i)) : null;
    var rv = rho(row.i,row.v,row.k);
    return '<tr style="border-top:1px solid var(--line);">'+
      '<td>'+row.no+'</td><td>'+row.ab2+'</td><td>'+row.k+'</td><td>'+row.mn2+'</td>'+
      '<td><input data-datum-i="'+row.no+'" value="'+esc(row.i)+'" inputmode="decimal"></td>'+
      '<td><input data-datum-v="'+row.no+'" value="'+esc(row.v)+'" inputmode="decimal"></td>'+
      '<td id="r-'+row.no+'">'+(r!=null?r.toFixed(4):"")+'</td>'+
      '<td id="rho-'+row.no+'">'+(rv!=null?rv.toFixed(2):"")+'</td>'+
    '</tr>';
  }).join("");
  return ''+
  '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">'+
    '<button id="btnBackList" class="btn btn-ghost">&larr; Kembali ke daftar stasiun</button>'+
    '<button id="btnSaveStation" class="btn btn-primary">Simpan Stasiun</button>'+
  '</div>'+
  '<div class="panel">'+
    '<div style="display:flex;align-items:center;gap:10px;">'+
      '<div class="mono" style="background:var(--slate);color:#fff;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;">'+esc(d.no)+'</div>'+
      '<span id="datumCount" style="font-size:12px;color:var(--ink-soft);">'+filled+'/24 datum terisi</span>'+
    '</div>'+
    '<div class="grid-fields">'+
      '<div class="field"><label>Lokasi (Desa, Kecamatan)</label><input id="fLokasi" value="'+esc(d.lokasi)+'" placeholder="Desa ___, Kec. ___"></div>'+
      '<div class="field"><label>Tanggal</label><input id="fTanggal" type="date" value="'+esc(d.tanggal)+'"></div>'+
      '<div class="field"><label>Arah Lintasan</label><input id="fArah" value="'+esc(d.arahLintasan)+'" placeholder="mis. Utara - Selatan"></div>'+
      '<div class="field"><label>Pengamat</label><input id="fPengamat" value="'+esc(d.pengamat)+'" placeholder="Nama, gelar"></div>'+
      '<div class="field"><label>Formasi Geologi Regional (Lembar Buton)</label><select id="fFormasi">'+
        FORMASI_BUTON.map(function(f){ return '<option value="'+esc(f.v)+'" '+((d.formasi||"")===f.v?"selected":"")+'>'+esc(f.label)+'</option>'; }).join("")+
      '</select>'+
      '<div id="formasiAutoBadge" style="margin-top:4px;">'+
        (d.formasiAuto ? '<span style="font-size:11px;color:var(--good);font-weight:600;">\u2713 terdeteksi otomatis dari koordinat</span>'
          : (d.formasi ? '<span style="font-size:11px;color:var(--ink-soft);">dipilih manual</span>' : ''))+
      '</div></div>'+
    '</div>'+
    '<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">Formasi terisi otomatis begitu koordinat X/Y diisi (GPS/Clipboard/manual), berdasarkan Peta Geologi Regional Lembar Buton resmi. Bisa diganti manual bila hasil deteksi kurang sesuai kondisi lapangan.</p>'+
    '<div style="margin-top:14px;">'+
      '<label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;">Koordinat Lokasi</label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
        '<input id="draftX" value="'+esc(d.x)+'" placeholder="X (Bujur)" style="width:140px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:13px;">'+
        '<input id="draftY" value="'+esc(d.y)+'" placeholder="Y (Lintang)" style="width:140px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:13px;">'+
        '<button id="btnGPS" class="btn btn-primary">Ambil Koordinat GPS</button>'+
        '<button id="btnPaste" class="btn btn-ghost">Tempel dari Clipboard</button>'+
        '<span id="gpsStatusArea"></span>'+
      '</div>'+
      '<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">"Ambil Koordinat GPS" perlu izin lokasi browser. Jika ditolak, buka Google Maps, tekan lama titik lokasi, ketuk koordinatnya untuk menyalin, lalu kembali ke sini dan ketuk "Tempel dari Clipboard".</p>'+
    '</div>'+
  '</div>'+
  '<div class="panel" style="margin-top:14px;padding:0;overflow:hidden;">'+
    '<div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">'+
      '<div style="font-weight:600;font-size:13px;">Tabel Hasil Pengukuran Lapangan</div>'+
      '<div style="font-size:11px;color:var(--ink-soft);">AB/2, K, MN/2 mengikuti pola baku — isi I dan V saja</div>'+
    '</div>'+
    '<div style="overflow-x:auto;"><table class="mono" style="font-size:12.5px;"><thead><tr>'+
      '<th>No</th><th>AB/2 (m)</th><th>K</th><th>MN/2 (m)</th><th>I (mA)</th><th>V (mV)</th><th>R=V/I</th><th>\u03C1a (\u03A9\u00B7m)</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+

function renderRekapTab(){
  if(!S.kabData) return '<div class="center">Memuat...</div>';
  if(S.kabData.stations.length===0){
    return '<div class="panel empty"><div style="font-weight:600;margin-bottom:4px;">Belum ada data untuk direkap</div>'+
      '<p style="color:var(--ink-soft);font-size:13px;">Tambahkan minimal satu stasiun pada tab Input Data.</p></div>';
  }
  var routePoints = S.kabData.stations.filter(function(s){return s.x&&s.y;})
    .map(function(s){ return {no:s.no, x:parseFloat(s.x), y:parseFloat(s.y)}; });

  var rows = S.kabData.stations.map(function(s){
    return '<tr style="border-top:1px solid var(--line);">'+
      '<td class="mono" style="font-weight:700;">'+esc(s.no)+'</td><td>'+esc(s.lokasi||"-")+'</td>'+
      '<td class="mono">'+(s.x&&s.y?esc(s.x+", "+s.y):"-")+'</td><td>'+esc(s.tanggal)+'</td>'+
      '<td>'+s.datum.filter(function(d){return d.i&&d.v;}).length+'/24</td>'+
      '<td><button data-edit="'+esc(s.id)+'" class="btn btn-ghost btn-sm">Edit</button></td>'+
    '</tr>';
  }).join("");

  var activeId = S.selectedStationId || S.kabData.stations[0].id;
  var activeStation = S.kabData.stations.find(function(s){return s.id===activeId;}) || S.kabData.stations[0];
  var vesData = activeStation.datum.map(function(d){ return {ab2:d.ab2, rhoa:rho(d.i,d.v,d.k)}; })
    .filter(function(p){ return p.rhoa!=null; });
  var layers = interpretLayers(activeStation.datum, activeStation.formasi);
  var stationOpts = S.kabData.stations.map(function(s){
    return '<option value="'+esc(s.id)+'" '+(s.id===activeStation.id?"selected":"")+'>'+esc(s.no)+' — '+esc(s.lokasi||"belum ada lokasi")+'</option>';
  }).join("");
  var activeFormasi = getFormasi(activeStation.formasi);

  var layerRows = layers.map(function(l){
    var crossHtml = l.cross ? (
      '<div style="font-size:11px;margin-left:20px;margin-top:2px;color:'+(l.cross.match?"var(--good)":"var(--warn)")+';">'+esc(l.cross.text)+'</div>'
    ) : "";
    return '<div style="margin-bottom:6px;">'+
      '<div style="display:flex;align-items:center;gap:10px;font-size:12px;">'+
      '<div style="width:10px;height:10px;border-radius:2px;background:'+l.color+';flex-shrink:0;"></div>'+
      '<span class="mono" style="color:var(--ink-soft);min-width:90px;">AB/2 '+l.ab2Min+'–'+l.ab2Max+' m</span>'+
      '<span class="mono" style="color:var(--ink-soft);min-width:90px;">'+l.rhoAvg.toFixed(1)+' \u03A9\u00B7m</span>'+
      '<span>'+esc(l.label)+'</span></div>'+crossHtml+'</div>';
  }).join("");

  return ''+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">'+
    '<div><h1 style="font-size:20px;font-weight:700;margin:0;">Rekapan &amp; Laporan — '+esc(S.kabData.nama)+'</h1>'+
    '<p style="color:var(--ink-soft);font-size:13px;margin:4px 0 0;">'+S.kabData.stations.length+' stasiun · '+routePoints.length+' titik berkoordinat</p></div>'+
    '<div style="display:flex;gap:8px;"><button id="btnExportExcel" class="btn btn-primary">Export Excel</button>'+
    '<button id="btnPrint" class="btn btn-ghost">Cetak Laporan (PDF)</button></div>'+
  '</div>'+
  '<div class="panel" style="padding:0;overflow:hidden;margin-bottom:18px;"><div style="overflow-x:auto;"><table><thead><tr>'+
    '<th>Stasiun</th><th>Lokasi</th><th>Koordinat</th><th>Tanggal</th><th>Datum Terisi</th><th></th>'+
  '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div style="display:flex;align-items:center;gap:8px;margin:6px 0 10px;"><div style="font-weight:700;font-size:14px;">Peta Lintasan Stasiun</div></div>'+
  '<div class="panel" style="margin-bottom:18px;">'+svgRouteMap(routePoints)+
    '<p style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Sebaran titik koordinat stasiun berurutan sesuai kunjungan lapangan.</p></div>'+
  '<div style="display:flex;align-items:center;gap:8px;margin:6px 0 10px;"><div style="font-weight:700;font-size:14px;">Interpretasi Sounding Geolistrik (VES)</div></div>'+
  '<div class="panel">'+
    '<div class="field" style="margin-bottom:12px;max-width:260px;"><label>Pilih Stasiun</label><select id="stationChartSelect">'+stationOpts+'</select></div>'+
    (vesData.length>=2 ? (
      svgVesCurve(vesData)+
      (activeFormasi.v ? '<p style="font-size:12px;margin-top:10px;"><b>Formasi regional stasiun ini:</b> '+esc(activeFormasi.label)+' ('+esc(activeFormasi.umur||"-")+') — '+esc(activeFormasi.litho)+'</p>' : '')+
      '<div style="margin-top:14px;"><div style="font-size:12px;font-weight:600;margin-bottom:6px;">Indikasi Lapisan (segmentasi kurva sounding)</div>'+
      '<div style="display:grid;gap:6px;">'+layerRows+'</div>'+
      '<p style="font-size:11px;color:var(--warn);margin-top:10px;line-height:1.5;">Catatan: interpretasi resistivitas ini segmentasi indikatif dari kurva tahanan jenis semu, bukan hasil inversi 1D/2D penuh. Referensi silang formasi mengacu Peta Geologi Regional Lembar Buton (Sikumbang &amp; Sanyoto, 1981) — rentang tahanan-jenis per formasi adalah referensi umum dari litologi, bukan hasil pengukuran; selalu verifikasi terhadap legenda peta cetak/GIS resmi dan inversi standar (IP2WIN, Res2DINV).</p></div>'
    ) : '<p style="color:var(--ink-soft);font-size:13px;">Data I/V pada stasiun ini belum cukup untuk membentuk kurva sounding.</p>')+
  '</div>';
}

function renderPrintTab(){
  var kd = S.kabData;
  var routePoints = kd.stations.filter(function(s){return s.x&&s.y;}).map(function(s){return {no:s.no,x:parseFloat(s.x),y:parseFloat(s.y)};});
  var recapRows = kd.stations.map(function(s){
    return '<tr><td>'+esc(s.no)+'</td><td>'+esc(s.lokasi||"-")+'</td><td>'+(s.x&&s.y?esc(s.x+", "+s.y):"-")+'</td><td>'+esc(s.tanggal)+'</td><td>'+esc(s.pengamat||"-")+'</td></tr>';
  }).join("");
  var stationBlocks = kd.stations.map(function(s){
    var vesData = s.datum.map(function(d){return {ab2:d.ab2,rhoa:rho(d.i,d.v,d.k)};}).filter(function(p){return p.rhoa!=null;});
    var layers = interpretLayers(s.datum, s.formasi);
    var formasiInfo = getFormasi(s.formasi);
    var layerRows = layers.map(function(l){
      var crossText = l.cross ? l.cross.text : "-";
      return '<tr><td>'+l.lapisan+'</td><td>'+l.ab2Min+'–'+l.ab2Max+'</td><td>'+l.rhoAvg.toFixed(1)+'</td><td>'+esc(l.label)+'</td><td>'+esc(crossText)+'</td></tr>';
    }).join("");
    return '<div style="margin-bottom:28px;page-break-inside:avoid;">'+
      '<h3 style="font-size:14px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:4px;">'+esc(s.no)+' — '+esc(s.lokasi||"(lokasi tidak diisi)")+'</h3>'+
      '<div style="font-size:11px;margin-bottom:6px;color:#444;">Koordinat: '+(s.x&&s.y?esc(s.x+", "+s.y):"-")+' · Tanggal: '+esc(s.tanggal)+' · Arah lintasan: '+esc(s.arahLintasan||"-")+' · Pengamat: '+esc(s.pengamat||"-")+
        (formasiInfo.v ? (' · Formasi regional: '+esc(formasiInfo.label)) : '')+'</div>'+
      (vesData.length>=2 ? '<div style="margin-bottom:8px;">'+svgVesCurve(vesData,560,160)+'</div>' : '')+
      (layers.length>0 ? '<table class="print-table"><thead><tr><th>Lapisan</th><th>AB/2 (m)</th><th>\u03C1a rata-rata (\u03A9\u00B7m)</th><th>Indikasi Litologi (Resistivitas)</th><th>Referensi Silang Formasi Regional</th></tr></thead><tbody>'+layerRows+'</tbody></table>' : '')+
    '</div>';
  }).join("");

  return ''+
  '<div class="no-print" style="padding:16px;background:var(--slate);display:flex;justify-content:space-between;align-items:center;margin:-22px -16px 20px;">'+
    '<button id="btnBackRekap" class="btn btn-ghost-dark">&larr; Kembali</button>'+
    '<button id="btnDoPrint" class="btn btn-primary">Cetak / Simpan sebagai PDF</button>'+
  '</div>'+
  '<div style="max-width:900px;margin:0 auto;padding:0 10px 40px;background:#fff;color:#111;">'+
    '<div style="text-align:center;margin-bottom:30px;border-bottom:2px solid #1F2937;padding-bottom:16px;">'+
      '<div style="font-size:12px;letter-spacing:1px;">PEMERINTAH PROVINSI SULAWESI TENGGARA</div>'+
      '<div style="font-size:12px;letter-spacing:1px;">DINAS ENERGI DAN SUMBER DAYA MINERAL — BIDANG GEOLOGI DAN AIR TANAH</div>'+
      '<h1 style="font-size:20px;margin:14px 0 4px;">LAPORAN PENGUMPULAN DAN PENGOLAHAN DATA</h1>'+
      '<h1 style="font-size:20px;margin:0 0 10px;">ZONA KONSERVASI AIR TANAH</h1>'+
      '<div style="font-size:14px;font-weight:600;">DI KABUPATEN '+esc(kd.nama.toUpperCase())+'</div>'+
    '</div>'+
    '<div class="print-h2">1. Ringkasan Kegiatan</div>'+
    '<table class="print-table"><tbody>'+
      '<tr><td style="font-weight:600;width:220px;background:#fafafa;">Jumlah Stasiun Pendugaan</td><td>'+kd.stations.length+'</td></tr>'+
      '<tr><td style="font-weight:600;background:#fafafa;">Rentang Tanggal</td><td>'+(kd.stations.length?esc(kd.stations[0].tanggal+" s/d "+kd.stations[kd.stations.length-1].tanggal):"-")+'</td></tr>'+
      '<tr><td style="font-weight:600;background:#fafafa;">Stasiun Berkoordinat</td><td>'+routePoints.length+' dari '+kd.stations.length+'</td></tr>'+
    '</tbody></table>'+
    '<div class="print-h2">2. Rekapitulasi Stasiun</div>'+
    '<table class="print-table"><thead><tr><th>Stasiun</th><th>Lokasi</th><th>Koordinat</th><th>Tanggal</th><th>Pengamat</th></tr></thead><tbody>'+recapRows+'</tbody></table>'+
    '<div class="print-h2">3. Peta Lintasan Stasiun</div>'+
    '<div style="border:1px solid #ccc;padding:8px;margin-bottom:10px;">'+svgRouteMap(routePoints,700,300)+'</div>'+
    '<div class="print-h2">4. Data &amp; Interpretasi per Stasiun</div>'+
    stationBlocks+
    '<p style="font-size:10px;color:#777;margin-top:30px;border-top:1px solid #ccc;padding-top:10px;">Interpretasi lapisan pada laporan ini bersifat indikatif (segmentasi kurva tahanan jenis semu), disusun otomatis dari data lapangan yang diinput. Bukan pengganti inversi 1D/2D profesional (IP2WIN/Res2DINV) yang digunakan pada laporan akhir resmi.</p>'+
  '</div>';
}

/* ============================================================
   EVENT WIRING (dipanggil ulang setiap renderApp)
   ============================================================ */
function attachHandlers(){
  var kabSelect = document.getElementById("kabSelect");
  if(kabSelect) kabSelect.onchange = function(){ loadKabupaten(this.value); };

  var btnShowAddKab = document.getElementById("btnShowAddKab");
  if(btnShowAddKab) btnShowAddKab.onclick = function(){ S.showAddKab=true; renderApp();
    setTimeout(function(){ var el=document.getElementById("newKabInput"); if(el) el.focus(); },0); };
  var btnConfirmAddKab = document.getElementById("btnConfirmAddKab");
  if(btnConfirmAddKab) btnConfirmAddKab.onclick = handleAddKabupaten;
  var newKabInput = document.getElementById("newKabInput");
  if(newKabInput) newKabInput.onkeydown = function(e){ if(e.key==="Enter") handleAddKabupaten(); };

  document.querySelectorAll("nav.tabs button").forEach(function(btn){
    btn.onclick = function(){ S.tab=this.getAttribute("data-tab"); renderApp(); };
  });

  var btnNewStation = document.getElementById("btnNewStation");
  if(btnNewStation) btnNewStation.onclick = startNewStation;
  var btnNewStation2 = document.getElementById("btnNewStation2");
  if(btnNewStation2) btnNewStation2.onclick = startNewStation;
  var btnAutoDetectAll = document.getElementById("btnAutoDetectAll");
  if(btnAutoDetectAll) btnAutoDetectAll.onclick = autoDetectAllStations;

  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click", function(ev){
      if(ev.target.closest("[data-del]")) return;
      editStation(this.getAttribute("data-edit"));
    });
  });
  document.querySelectorAll("[data-del]").forEach(function(el){
    el.onclick = function(ev){ ev.stopPropagation(); deleteStation(this.getAttribute("data-del")); };
  });

  var btnBackList = document.getElementById("btnBackList");
  if(btnBackList) btnBackList.onclick = backToList;
  var btnSaveStation = document.getElementById("btnSaveStation");
  if(btnSaveStation) btnSaveStation.onclick = saveStation;

  ["fLokasi","fTanggal","fArah","fPengamat"].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    var field = {fLokasi:"lokasi", fTanggal:"tanggal", fArah:"arahLintasan", fPengamat:"pengamat"}[id];
    el.oninput = function(){ updateDraftField(field, this.value); };
  });
  var fFormasi = document.getElementById("fFormasi");
  if(fFormasi) fFormasi.onchange = function(){
    updateDraftField("formasi", this.value);
    var badge = document.getElementById("formasiAutoBadge");
    if(badge) badge.innerHTML = '<span style="font-size:11px;color:var(--ink-soft);">dipilih manual</span>';
  };
  var draftX = document.getElementById("draftX");
  if(draftX) draftX.addEventListener("change", function(){ updateDraftField("x", this.value); tryAutoDetectFormasi(); });
  if(draftX) draftX.oninput = function(){ updateDraftField("x", this.value); };
  var draftY = document.getElementById("draftY");
  if(draftY) draftY.addEventListener("change", function(){ updateDraftField("y", this.value); tryAutoDetectFormasi(); });
  if(draftY) draftY.oninput = function(){ updateDraftField("y", this.value); };

  var btnGPS = document.getElementById("btnGPS");
  if(btnGPS) btnGPS.onclick = captureGPS;
  var btnPaste = document.getElementById("btnPaste");
  if(btnPaste) btnPaste.onclick = pasteFromClipboard;

  document.querySelectorAll("[data-datum-i]").forEach(function(el){
    el.oninput = function(){ updateDatumField(parseInt(this.getAttribute("data-datum-i")), "i", this.value); };
  });
  document.querySelectorAll("[data-datum-v]").forEach(function(el){
    el.oninput = function(){ updateDatumField(parseInt(this.getAttribute("data-datum-v")), "v", this.value); };
  });

  var btnExportExcel = document.getElementById("btnExportExcel");
  if(btnExportExcel) btnExportExcel.onclick = exportExcel;
  var btnPrint = document.getElementById("btnPrint");
  if(btnPrint) btnPrint.onclick = function(){ S.tab="print"; renderApp(); };
  var btnBackRekap = document.getElementById("btnBackRekap");
  if(btnBackRekap) btnBackRekap.onclick = function(){ S.tab="rekap"; renderApp(); };
  var btnDoPrint = document.getElementById("btnDoPrint");
  if(btnDoPrint) btnDoPrint.onclick = function(){ window.print(); };

  var stationChartSelect = document.getElementById("stationChartSelect");
  if(stationChartSelect) stationChartSelect.onchange = function(){ S.selectedStationId=this.value; renderApp(); };
}

/* ============================================================
   SERVICE WORKER (mode offline) + ANTREAN SINKRONISASI
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* abaikan jika gagal daftar */ });
  });
}

var QUEUE_KEY = "zkat-pending-queue";
function loadQueue(){
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch(e){ return []; }
}
function saveQueue(q){
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){ /* penyimpanan penuh/diblokir — abaikan */ }
}
function queueAction(action){
  var q = loadQueue();
  q.push(action);
  saveQueue(q);
  updateQueueBadge();
}
function updateQueueBadge(){
  var el = document.getElementById("queueBadge");
  var n = loadQueue().length;
  if(el) el.textContent = n>0 ? (n+" belum tersinkron") : "";
}
var isSyncing = false;
function trySyncQueue(){
  if(isSyncing) return;
  var q = loadQueue();
  if(q.length===0) return;
  if(!navigator.onLine) return;
  isSyncing = true;
  var next = q[0];
  apiPost(next.body).then(function(r){
    var rest = loadQueue().slice(1);
    if(r && r.ok){
      saveQueue(rest);
      if(next.body.action==="saveStation" && S.kabData && S.activeSlug===next.slug){
        var st = S.kabData.stations.find(function(s){ return s.id===next.body.station.id; });
        if(st) st._pending = false;
      }
      updateQueueBadge();
      renderApp();
    } else {
      // gagal lagi (mungkin masih offline atau server bermasalah) — coba lagi nanti
      saveQueue(q); // biarkan di antrean
    }
    isSyncing = false;
    if(rest.length>0) setTimeout(trySyncQueue, 1500);
  }).catch(function(){ isSyncing=false; });
}
window.addEventListener("online", function(){ S.isOnline=true; trySyncQueue(); renderApp(); });
setInterval(trySyncQueue, 20000); // coba sinkron berkala (jaga-jaga event 'online' tidak terpicu)

init();
</script>
